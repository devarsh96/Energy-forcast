server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: clean-hour
  task:
    scheduling:
      pool:
        # live refresh and history backfill run side by side
        size: 2
  mvc:
    async:
      request-timeout: 120s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cleanhour:
  # Stored history (JSON). In Docker this lives on the /data volume.
  store-path: ${CLEANHOUR_STORE_PATH:data/clean-hour-store.json}
  # Days of history to backfill and keep (about 3 months)
  backfill-days: 92
  ieso:
    base-url: https://reports-public.ieso.ca/public
    # Days used for the heatmap, hourly patterns and the gas indicator
    history-days: 7
    # Live output report is published roughly hourly; poll every 5 minutes
    refresh-ms: 300000
  # Lifecycle emission factors, g CO2-eq per kWh.
  # Source: IPCC AR5 WGIII (2014), Annex III, Table A.III.2, median values.
  emission-factors:
    NUCLEAR: 12
    GAS: 490
    HYDRO: 24
    WIND: 11
    SOLAR: 48
    BIOFUEL: 230

  # Ontario Energy Board Regulated Price Plan, commodity prices in cents per kWh.
  # Delivery, regulatory charges and HST are extra; the Ontario Electricity Rebate (OER) is a % credit.
  # Add a new block every November 1. Older blocks keep the 3-month history priced correctly.
  # Source: OEB / Hydro One published RPP prices.
  pricing:
    hst-pct: 13
    rate-sets:
      - effective: 2025-11-01
        tou-off: 9.8
        tou-mid: 15.7
        tou-on: 20.3
        ulo-overnight: 3.9
        ulo-weekend-off: 9.8
        ulo-mid: 15.7
        ulo-on: 39.1
        tier1: 12.0
        tier2: 14.2
        oer-pct: 23.5
      - effective: 2026-11-01
        tou-off: 9.1
        tou-mid: 14.6
        tou-on: 18.9
        ulo-overnight: 3.7
        ulo-weekend-off: 9.1
        ulo-mid: 14.6
        ulo-on: 37.7
        tier1: 11.2
        tier2: 13.2
        oer-pct: 15.7
