server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: clean-hour
  task:
    scheduling:
      pool:
        # live refresh and history backfill run side by side
        size: 2
  mvc:
    async:
      request-timeout: 120s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cleanhour:
  # Stored history (JSON). In Docker this lives on the /data volume.
  store-path: ${CLEANHOUR_STORE_PATH:data/clean-hour-store.json}
  # Days of history to backfill and keep (about 3 months)
  backfill-days: 92
  ieso:
    base-url: https://reports-public.ieso.ca/public
    # Days used for the heatmap, hourly patterns and the gas indicator
    history-days: 7
    # Live output report is published roughly hourly; poll every 5 minutes
    refresh-ms: 300000
  # Lifecycle emission factors, g CO2-eq per kWh.
  # Source: IPCC AR5 WGIII (2014), Annex III, Table A.III.2, median values.
  emission-factors:
    NUCLEAR: 12
    GAS: 490
    HYDRO: 24
    WIND: 11
    SOLAR: 48
    BIOFUEL: 230
