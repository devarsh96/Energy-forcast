services:
  clean-hour:
    build: .
    image: clean-hour:latest
    container_name: clean-hour
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      TZ: America/Toronto
      # Optional overrides, e.g. CLEANHOUR_IESO_HISTORY_DAYS: "7"
    volumes:
      # Keeps history and saved day-ahead forecasts across restarts and rebuilds
      - clean-hour-data:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clean-hour-data:
